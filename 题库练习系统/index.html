<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>题库练习系统 · 第19届振兴杯服务机器人应用技术员（学生组）</title>
<style>
  :root{
    --bg:#eef1f6; --card:#ffffff; --text:#1f2937; --sub:#6b7280; --brand:#2563eb; --brand-soft:#dbeafe;
    --ok:#16a34a; --ok-soft:#dcfce7; --bad:#dc2626; --bad-soft:#fee2e2; --line:#e5e7eb; --amber:#f59e0b;
    --shadow:0 1px 3px rgba(16,24,40,.08),0 8px 24px rgba(16,24,40,.06);
  }
  body.night{
    --bg:#0f172a; --card:#1e293b; --text:#e2e8f0; --sub:#94a3b8; --brand:#60a5fa; --brand-soft:#1e3a8a;
    --ok:#4ade80; --ok-soft:#14532d; --bad:#f87171; --bad-soft:#7f1d1d; --line:#334155; --amber:#fbbf24;
    --shadow:0 1px 3px rgba(0,0,0,.4);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei","PingFang SC","Hiragino Sans GB",sans-serif; font-size:16px; line-height:1.65; transition:background .2s,color .2s}
  #app{max-width:820px; margin:0 auto; padding:14px 14px 96px}
  button{font-family:inherit; font-size:1em; cursor:pointer; border:none; background:none; color:inherit}
  .card{background:var(--card); border-radius:14px; box-shadow:var(--shadow); padding:16px 16px 14px; margin-bottom:12px}
  h1{font-size:1.25em; margin:0 0 6px}
  h2{font-size:1.05em; margin:0 0 10px}
  .sub{color:var(--sub); font-size:.86em; margin:0}
  .hero{background:linear-gradient(135deg,#2563eb,#1d4ed8); color:#fff; border-radius:16px; padding:20px 18px; margin-bottom:14px; box-shadow:var(--shadow)}
  .hero h1{color:#fff; margin:0 0 4px; font-size:1.35em}
  .hero .sub{color:rgba(255,255,255,.85)}
  .grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:10px; margin-bottom:12px}
  .mode{background:var(--card); border-radius:14px; box-shadow:var(--shadow); padding:14px; text-align:left; transition:transform .12s}
  .mode:active{transform:scale(.98)}
  .mode .t{font-weight:600; display:block; margin-bottom:2px}
  .mode .d{color:var(--sub); font-size:.8em; display:block}
  .mode .badge{float:right; background:var(--brand-soft); color:var(--brand); border-radius:20px; font-size:.72em; padding:1px 8px; font-weight:600}
  .row{display:flex; align-items:center; gap:10px}
  .spread{justify-content:space-between}
  .btn{background:var(--brand); color:#fff; border-radius:10px; padding:10px 16px; font-weight:600}
  .btn.ghost{background:transparent; color:var(--brand); border:1px solid var(--brand)}
  .btn.plain{background:var(--card); color:var(--text); box-shadow:var(--shadow); font-weight:500}
  .btn.mini{padding:6px 12px; font-size:.86em; border-radius:8px}
  .btn[disabled]{opacity:.45; cursor:not-allowed}
  .topbar{display:flex; align-items:center; gap:8px; margin-bottom:10px; flex-wrap:wrap}
  .pill{background:var(--card); border-radius:20px; padding:4px 12px; font-size:.82em; color:var(--sub); box-shadow:var(--shadow); white-space:nowrap}
  .pill b{color:var(--brand)}
  .pill.ok{color:var(--ok); font-weight:600}
  .pill.bad{color:var(--bad); font-weight:600}
  .bar{height:6px; background:var(--line); border-radius:6px; overflow:hidden; margin:6px 0 4px}
  .bar>i{display:block; height:100%; background:var(--brand); width:0}
  .stem{font-size:1.06em; font-weight:500; margin-bottom:14px; word-break:break-word}
  .stem .no{color:var(--brand); font-weight:700; margin-right:4px}
  .opts{display:flex; flex-direction:column; gap:9px}
  .opt{display:flex; gap:10px; align-items:flex-start; text-align:left; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:11px 12px; width:100%; transition:background .15s,border-color .15s}
  .opt .k{flex:0 0 24px; height:24px; border-radius:50%; background:var(--bg); color:var(--sub); font-weight:700; font-size:.82em; display:flex; align-items:center; justify-content:center; margin-top:1px}
  .opt .t{flex:1; word-break:break-word}
  .opt.sel{border-color:var(--brand); background:var(--brand-soft)}
  .opt.sel .k{background:var(--brand); color:#fff}
  .opt.right{border-color:var(--ok); background:var(--ok-soft)}
  .opt.right .k{background:var(--ok); color:#fff}
  .opt.wrong{border-color:var(--bad); background:var(--bad-soft)}
  .opt.wrong .k{background:var(--bad); color:#fff}
  .opt .mark{font-weight:700; color:var(--ok)}
  .fb{margin-top:14px; padding:11px 12px; border-radius:12px; font-size:.92em}
  .fb.ok{background:var(--ok-soft); color:var(--ok)}
  .fb.bad{background:var(--bad-soft); color:var(--bad)}
  .fb.neutral{background:var(--brand-soft); color:var(--brand)}
  .fb b{color:inherit}
  .footbar{position:fixed; left:0; right:0; bottom:0; background:var(--card); border-top:1px solid var(--line); padding:9px 14px; display:flex; gap:8px; justify-content:center; align-items:center; z-index:30}
  .footbar .inner{max-width:820px; width:100%; display:flex; gap:8px; align-items:center}
  .footbar .btn{flex:1}
  .footbar .btn.icon{flex:0 0 auto}
  .mask{position:fixed; inset:0; background:rgba(15,23,42,.5); display:flex; align-items:flex-end; justify-content:center; z-index:40}
  .sheet{background:var(--card); width:100%; max-width:820px; border-radius:16px 16px 0 0; padding:16px; max-height:78vh; overflow:auto}
  .legend{display:flex; gap:14px; flex-wrap:wrap; font-size:.78em; color:var(--sub); margin-bottom:10px}
  .legend i{display:inline-block; width:10px; height:10px; border-radius:3px; margin-right:4px}
  .nums{display:grid; grid-template-columns:repeat(auto-fill,minmax(42px,1fr)); gap:7px}
  .nums button{background:var(--bg); border-radius:9px; padding:7px 0; font-size:.85em; color:var(--sub)}
  .nums button.ok{background:var(--ok-soft); color:var(--ok); font-weight:700}
  .nums button.bad{background:var(--bad-soft); color:var(--bad); font-weight:700}
  .nums button.cur{outline:2px solid var(--brand); color:var(--brand); font-weight:700}
  .nums button.done{background:var(--brand-soft); color:var(--brand)}
  .kv{display:grid; grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); gap:10px}
  .kvi{background:var(--bg); border-radius:12px; padding:12px; text-align:center}
  .kvi b{display:block; font-size:1.5em; color:var(--brand)}
  .kvi span{font-size:.78em; color:var(--sub)}
  label.field{display:flex; align-items:center; justify-content:space-between; gap:12px; padding:11px 0; border-bottom:1px solid var(--line); font-size:.94em}
  label.field:last-child{border-bottom:none}
  input[type=number],input[type=text],textarea,select{font-family:inherit; font-size:.95em; padding:9px 10px; border:1px solid var(--line); border-radius:10px; background:var(--card); color:var(--text); width:100%}
  input[type=number]{width:84px; text-align:center}
  textarea{min-height:170px; resize:vertical; font-size:.88em; line-height:1.5}
  .switch{width:46px; height:26px; border-radius:20px; background:var(--line); position:relative; flex:0 0 auto; transition:background .18s}
  .switch.on{background:var(--brand)}
  .switch i{position:absolute; top:3px; left:3px; width:20px; height:20px; border-radius:50%; background:#fff; transition:left .18s}
  .switch.on i{left:23px}
  .note{color:var(--sub); font-size:.82em; line-height:1.7}
  .note code{background:var(--bg); padding:1px 5px; border-radius:5px}
  .toast{position:fixed; left:50%; bottom:88px; transform:translateX(-50%); background:rgba(17,24,39,.92); color:#fff; padding:9px 16px; border-radius:24px; font-size:.86em; z-index:60; max-width:88vw}
  .score{text-align:center; padding:6px 0 2px}
  .score b{font-size:2.6em; color:var(--brand); line-height:1.1}
  .score em{font-style:normal; color:var(--sub); font-size:.85em}
  .wronglist{margin-top:6px}
  .wronglist .item{border:1px solid var(--line); border-radius:12px; padding:11px 12px; margin-bottom:9px; font-size:.9em}
  .wronglist .item .q{margin-bottom:6px}
  .tag{display:inline-block; font-size:.72em; padding:1px 7px; border-radius:20px; background:var(--brand-soft); color:var(--brand); margin-right:6px; vertical-align:1px}
  .tag.ok{background:var(--ok-soft); color:var(--ok)}
  .tag.bad{background:var(--bad-soft); color:var(--bad)}
  .sec{margin:14px 0 8px; font-weight:600; font-size:.95em; color:var(--sub)}
  .hide{display:none}
  @media(max-width:480px){ .grid{grid-template-columns:1fr 1fr} h1{font-size:1.15em} }
</style>
</head>
<body>
<div id="app">加载中…</div>
<script src="core.js"></script>
<script src="bank.js"></script>
<script src="app.js"></script>
</body>
</html>
